# ═══════════════════════════════════════════════════════════════════════════
# Neuraline EMR — Nginx Configuration for EC2 (Phase 1: No Docker)
#
# This config serves the frontend static files from /var/www/neuraline
# and proxies /api/ requests to the NestJS backend on port 4000.
#
# Includes both HTTP (redirect) and HTTPS (SSL) server blocks.
# Certificate paths are managed by Certbot — if certs don't exist yet,
# run: sudo certbot --nginx -d app.neura-line.com
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/neuraline
#   sudo ln -sf /etc/nginx/sites-available/neuraline /etc/nginx/sites-enabled/neuraline
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# ═══════════════════════════════════════════════════════════════════════════

# ── Upstream definition ────────────────────────────────────────────────────
upstream neuraline_backend {
    server 127.0.0.1:4000;
}

# ── HTTP: Redirect to HTTPS ────────────────────────────────────────────────
server {
    listen 80;
    server_name app.neura-line.com;

    # Let ACME challenge through (Certbot renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: Main application server ─────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name app.neura-line.com;

    # SSL certificates (managed by Certbot)
    # If these don't exist yet, comment out this server block and run:
    #   sudo certbot --nginx -d app.neura-line.com
    ssl_certificate     /etc/letsencrypt/live/app.neura-line.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.neura-line.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /var/www/neuraline;
    index index.html;

    # ── Security Headers (HIPAA) ───────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HIPAA: Permissions Policy — camera/mic allowed for telemedicine video calls
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # HIPAA: Content Security Policy – restrict resource origins
    # connect-src includes wss: for WebSocket (telemedicine) connections
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob:; connect-src 'self' wss: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # HIPAA: Prevent caching of HTML (may contain PHI in SPA state)
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Pragma "no-cache" always;

    # ── Gzip Compression ───────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    # ── API Proxy to NestJS Backend ────────────────────────────────────────
    location /api/ {
        proxy_pass http://neuraline_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support large audio uploads for transcription (AssemblyAI)
        client_max_body_size 50m;

        # LLM inference can take time; be generous with timeouts
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # WebSocket support (for real-time features)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── WebSocket Proxy for Telemedicine (Socket.IO namespace /telemedicine) ─
    # EXACT match: only /telemedicine (Socket.IO with query params like ?EIO=4&transport=websocket)
    # Does NOT match /telemedicine/SESSION_ID (that's a frontend page route → SPA)
    location = /telemedicine {
        proxy_pass http://neuraline_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Long-lived WebSocket connections
        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Socket.IO polling fallback (for clients that can't use WebSocket) ───
    location /socket.io/ {
        proxy_pass http://neuraline_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── SPA Fallback ───────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        # HIPAA: No caching for SPA shell (it renders PHI)
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ── Cache Static Assets ────────────────────────────────────────────────
    # These are hashed build artifacts (no PHI) – safe to cache aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Disable access to hidden files ─────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Health check endpoint ──────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
