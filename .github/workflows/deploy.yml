name: Deploy to AWS

on:
  # Automatic: deploy after CI Pipeline completes successfully on main
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: ["main"]
  # Manual: click "Run workflow" button in GitHub Actions UI
  workflow_dispatch:
    inputs:
      skip_ci:
        description: 'Skip CI checks (deploy immediately)'
        required: false
        default: false
        type: boolean
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

# Cancel any in-progress deploy to the same environment
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Gate 1: Verify CI passed on this commit (skippable for manual deploys)
  # ─────────────────────────────────────────────────────────────────────────
  verify-ci:
    name: Verify CI Passed
    runs-on: ubuntu-latest
    outputs:
      ci_passed: ${{ steps.skip-check.outputs.passed || steps.check.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # When triggered by workflow_run, checkout the CI run's commit
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Skip CI check (manual deploy with skip_ci=true)
        if: github.event_name == 'workflow_dispatch' && inputs.skip_ci == true
        id: skip-check
        run: |
          echo "⏭️ CI check skipped (manual deploy with skip_ci=true)"
          echo "passed=true" >> $GITHUB_OUTPUT

      - name: Check CI result from workflow_run event
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_ci == true) }}
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            // When triggered by workflow_run, the conclusion is in the event payload
            // In github-script, use context.eventName (camelCase) and context.payload
            const eventName = context.eventName;
            console.log('Event name:', eventName);

            if (eventName === 'workflow_run') {
              const conclusion = context.payload.workflow_run.conclusion;
              const headSha = context.payload.workflow_run.head_sha;
              console.log(`CI Pipeline conclusion: ${conclusion}`);
              console.log(`CI Pipeline head_sha: ${headSha}`);

              if (conclusion === 'success') {
                console.log('✅ CI passed, proceeding with deploy');
                core.setOutput('passed', 'true');
                return;
              } else {
                core.setFailed(`❌ CI failed with conclusion: ${conclusion}. Deploy aborted. Fix the failing checks, or use manual deploy with "Skip CI checks" enabled.`);
                core.setOutput('passed', 'false');
                return;
              }
            }

            // Fallback for manual dispatch without skip_ci
            // Wait up to 10 minutes for CI to complete
            const maxAttempts = 30;
            const sleepMs = 20000;

            for (let i = 0; i < maxAttempts; i++) {
              const { data } = await github.rest.checkSuites.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
              });

              const ciSuite = data.check_suites.find(
                suite => suite.app?.slug === 'github-actions' &&
                         suite.conclusion !== null
              );

              if (ciSuite) {
                if (ciSuite.conclusion === 'success') {
                  console.log('✅ CI passed on commit:', context.sha);
                  core.setOutput('passed', 'true');
                  return;
                } else {
                  core.setFailed(`❌ CI failed with conclusion: ${ciSuite.conclusion}. Fix the failing checks before deploying, or use manual deploy with "Skip CI checks" enabled.`);
                  core.setOutput('passed', 'false');
                  return;
                }
              }

              console.log(`Waiting for CI to finish... (attempt ${i + 1}/${maxAttempts})`);
              await new Promise(r => setTimeout(r, sleepMs));
            }

            core.setFailed('❌ CI did not complete within 10 minutes. Deploy aborted. Use manual deploy with "Skip CI checks" if needed.');
            core.setOutput('passed', 'false');

  # ─────────────────────────────────────────────────────────────────────────
  # Gate 2: Deploy to EC2 via SSH
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: verify-ci
    if: needs.verify-ci.outputs.ci_passed == 'true'
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          port: 22
          timeout: 600s
          script: |
            echo "=== Neuraline EMR Deploy ==="
            echo "Commit: ${{ github.event.workflow_run.head_sha || github.sha }}"
            echo "Triggered by: ${{ github.actor }}"
            echo "Event: ${{ github.event_name }}"
            echo ""

            # ─── Diagnostic: Check prerequisites ──────────────────────────
            echo "=== Pre-Deploy Diagnostics ==="
            echo "User: $(whoami)"
            echo "Home: $HOME"
            echo "OS: $(cat /etc/os-release 2>/dev/null | grep PRETTY_NAME || echo unknown)"
            echo "Node: $(node --version 2>/dev/null || echo 'NOT INSTALLED')"
            echo "npm:  $(npm --version 2>/dev/null || echo 'NOT INSTALLED')"
            echo "PM2:  $(pm2 --version 2>/dev/null || echo 'NOT INSTALLED')"
            echo "Nginx: $(nginx -v 2>&1 || echo 'NOT INSTALLED')"
            echo "Git:  $(git --version 2>/dev/null || echo 'NOT INSTALLED')"
            echo ""

            # ─── Clone repo if it doesn't exist yet (first deploy) ────────
            if [ ! -d /opt/neuraline/.git ]; then
              echo "▶ First deploy: cloning repo to /opt/neuraline..."
              sudo mkdir -p /opt/neuraline
              sudo chown -R $(whoami):$(whoami) /opt/neuraline
              git clone https://github.com/AvinashNallathambi/NeuralineBase.git /opt/neuraline
              echo "  ✅ Repo cloned"
            fi

            cd /opt/neuraline || { echo "❌ Cannot cd to /opt/neuraline"; exit 1; }

            # ─── Run deploy script or fall back to manual steps ───────────
            if [ -f deploy/deploy.sh ]; then
              chmod +x deploy/deploy.sh
              echo "▶ Running deploy/deploy.sh..."
              ./deploy/deploy.sh 2>&1 || {
                echo "❌ deploy.sh failed with exit code $?"
                echo "=== Last 30 lines of PM2 logs ==="
                pm2 logs --lines 30 --nostream 2>/dev/null || true
                exit 1
              }
            else
              echo "⚠️  deploy/deploy.sh not found — running inline deploy..."
              git pull origin main || true
              rm -f package-lock.json frontend/package-lock.json backend/package-lock.json
              npm install
              export NODE_OPTIONS='--max-old-space-size=1536'
              cd backend && npm run build && cd ..
              cd frontend && npm run build && cd ..
            fi

            # ─── Final verification ───────────────────────────────────────
            echo ""
            echo "=== Post-Deploy Verification ==="
            echo "Backend process:"
            pm2 status 2>/dev/null || echo "PM2 not available"

            echo ""
            echo "Nginx status:"
            sudo systemctl is-active nginx 2>/dev/null && echo "Nginx: ACTIVE" || echo "Nginx: FAILED/NOT INSTALLED"

            echo ""
            echo "Health check (local):"
            curl -sf http://localhost:4000/api/v1/health 2>/dev/null && echo "" || echo "⚠️ Backend health check failed (local)"

            echo ""
            echo "Health check (HTTPS):"
            curl -sf https://app.neura-line.com/api/v1/health 2>/dev/null && echo "" || echo "⚠️ Backend health check failed (HTTPS)"

            echo ""
            echo "✅ Deploy complete: ${{ github.event.workflow_run.head_sha || github.sha }}"
