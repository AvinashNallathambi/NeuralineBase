name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Stage 1: Lint + Typecheck (runs in parallel for frontend and backend)
  # ─────────────────────────────────────────────────────────────────────
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          rm -f package-lock.json frontend/package-lock.json backend/package-lock.json
          npm install

      - name: Lint (all workspaces)
        run: npm run lint

      - name: Typecheck backend
        run: npx tsc --noEmit --project backend/tsconfig.json

      - name: Typecheck frontend
        continue-on-error: true
        run: npx tsc --noEmit --project frontend/tsconfig.app.json

  # ─────────────────────────────────────────────────────────────────────
  # Stage 2: Unit Tests
  # ─────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          rm -f package-lock.json frontend/package-lock.json backend/package-lock.json
          npm install

      - name: Run backend unit tests
        run: npm run test:backend

      - name: Run frontend unit tests
        run: npm run test:frontend

  # ─────────────────────────────────────────────────────────────────────
  # Stage 3: E2E Tests (backend only — needs test DB)
  # ─────────────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint-typecheck, unit-tests]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neuraline
          POSTGRES_PASSWORD: neuraline_dev
          POSTGRES_DB: neuraline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: neuraline
      DB_PASSWORD: neuraline_dev
      DB_DATABASE: neuraline_test
      DB_SYNCHRONIZE: "true"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      JWT_SECRET: test-jwt-secret
      STEDI_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          rm -f package-lock.json frontend/package-lock.json backend/package-lock.json
          npm install

      - name: Run backend E2E tests
        continue-on-error: true
        run: cd backend && npx jest --config ./test/jest-e2e.json --forceExit

  # ─────────────────────────────────────────────────────────────────────
  # Stage 4: Build (verify both apps compile)
  # ─────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          rm -f package-lock.json frontend/package-lock.json backend/package-lock.json
          npm install

      - name: Build backend
        run: npm run build:backend

      - name: Build frontend
        run: npm run build:frontend

  # ─────────────────────────────────────────────────────────────────────
  # Stage 5: Security Audit
  # ─────────────────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          rm -f package-lock.json frontend/package-lock.json backend/package-lock.json
          npm install

      - name: npm audit (high+ severity)
        continue-on-error: true
        run: npm audit --audit-level=high

  # ─────────────────────────────────────────────────────────────────────
  # Stage 5b: Migration Safety Check
  # Verifies that DB_SYNCHRONIZE is not enabled in production env files
  # ─────────────────────────────────────────────────────────────────────
  migration-safety:
    name: Migration Safety
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Check DB_SYNCHRONIZE is not enabled in production
        run: |
          # Check .env.example for dangerous defaults
          if grep -q "DB_SYNCHRONIZE=true" .env.example backend/.env.example 2>/dev/null; then
            echo "❌ DB_SYNCHRONIZE=true found in .env.example — this is dangerous"
            exit 1
          fi

          # Check that all CREATE TABLE/INDEX use IF NOT EXISTS (prevent re-run failures)
          BARE_CREATE=$(grep -r 'CREATE TABLE "' backend/src/migrations/ | grep -v 'IF NOT EXISTS' | wc -l)
          if [ "$BARE_CREATE" -gt 0 ]; then
            echo "❌ Found CREATE TABLE without IF NOT EXISTS in migrations"
            grep -rn 'CREATE TABLE "' backend/src/migrations/ | grep -v 'IF NOT EXISTS' || true
            exit 1
          fi

          # CREATE TYPE does NOT support IF NOT EXISTS in PostgreSQL
          # It must be wrapped in a DO block with pg_type check instead
          BARE_TYPE=$(grep -r 'CREATE TYPE ' backend/src/migrations/ | grep -v 'DO \$\$' | wc -l)
          if [ "$BARE_TYPE" -gt 0 ]; then
            echo "❌ Found CREATE TYPE outside DO block in migrations"
            echo "   PostgreSQL does not support CREATE TYPE IF NOT EXISTS."
            echo "   Wrap in: DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_type WHERE typname = '...') THEN CREATE TYPE ...; END IF; END \$\$"
            grep -rn 'CREATE TYPE ' backend/src/migrations/ | grep -v 'DO \$\$' || true
            exit 1
          fi

          # Also check for invalid CREATE TYPE IF NOT EXISTS (syntax error in PostgreSQL)
          INVALID_TYPE=$(grep -r 'CREATE TYPE IF NOT EXISTS' backend/src/migrations/ | wc -l)
          if [ "$INVALID_TYPE" -gt 0 ]; then
            echo "❌ Found CREATE TYPE IF NOT EXISTS — this is invalid PostgreSQL syntax"
            grep -rn 'CREATE TYPE IF NOT EXISTS' backend/src/migrations/ || true
            exit 1
          fi

          echo "✅ Migration safety checks passed"

  # ─────────────────────────────────────────────────────────────────────
  # Stage 6: All checks passed (gate for deploy)
  # ─────────────────────────────────────────────────────────────────────
  all-checks-passed:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint-typecheck, unit-tests, e2e-tests, build, security-audit, migration-safety]
    steps:
      - name: Pipeline succeeded
        run: |
          echo "✅ All CI checks passed."
          echo "The code is ready for auto-deployment to AWS."
